name: Enviar alertas diarias

on:
  workflow_dispatch:
  schedule:
    # 23:00 local time, including winter/summer changes. Delayed starts until
    # 06:00 retain the preceding evening's target session, not the new date.
    - cron: "0 23 * * 1-5"
      timezone: "Europe/Madrid"
    # Recovery attempt for the same session (Tue–Sat), away from the top of
    # the hour. The persistent claim prevents a second email, even if the
    # first attempt was accepted by SMTP but its final status is uncertain.
    - cron: "17 1 * * 2-6"
      timezone: "Europe/Madrid"

concurrency:
  group: stock-signal-lab-daily-alerts
  cancel-in-progress: false

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Analizar y enviar resúmenes
        env:
          MODEL_RESULTS_ENABLED: ${{ vars.MODEL_RESULTS_ENABLED }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EMAIL_SMTP_HOST: smtp.gmail.com
          EMAIL_SMTP_PORT: "465"
          EMAIL_SMTP_USE_SSL: "true"
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SENDER_NAME: Stock Signal Lab
        run: python -m scripts.run_alerts
