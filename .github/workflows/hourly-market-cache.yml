name: Actualizar caché de mercado (sin señales ni correos)

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Preparar una vez los datos aunque el mercado esté cerrado
        type: boolean
        default: false
  schedule:
    # Away from the busy top of the hour. Exchange calendars gate actual work.
    - cron: "17 * * * *"

concurrency:
  group: stock-signal-lab-market-cache
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Actualizar exclusivamente la caché privada de datos
        env:
          MARKET_CACHE_OWNER: ${{ github.repository_owner }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          if [ "$BOOTSTRAP" = "true" ]; then
            python -m scripts.refresh_market_cache --bootstrap
          else
            python -m scripts.refresh_market_cache
          fi
