name: Arena · recuperar correo pendiente

on:
  workflow_dispatch:
  schedule:
    - cron: "35 7 * * 1-5"
      timezone: "Europe/Madrid"
    - cron: "35 10 * * 1-5"
      timezone: "Europe/Madrid"

concurrency:
  group: stock-signal-lab-daily-alerts
  cancel-in-progress: false

jobs:
  recover-arena:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Preparar datos e informe privados, sin correo ni modelos
        id: arena_data
        env:
          ARENA_DATA_OWNER: ${{ github.repository_owner }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m scripts.run_arena_data
      - name: Recuperar solo Arena con el informe verificado, sin reenviar Stock Signal Lab
        if: ${{ !cancelled() && steps.arena_data.conclusion == 'success' && steps.arena_data.outputs.status == 'ready' }}
        env:
          ARENA_EXPECTED_SESSION: ${{ steps.arena_data.outputs.report_session }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EMAIL_SMTP_HOST: smtp.gmail.com
          EMAIL_SMTP_PORT: "465"
          EMAIL_SMTP_USE_SSL: "true"
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SENDER_NAME: Stock Signal Lab
        run: python -m scripts.send_arena_digest
