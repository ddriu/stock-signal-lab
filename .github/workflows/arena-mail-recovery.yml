name: Arena · recuperar correo pendiente

on:
  workflow_dispatch:
  schedule:
    - cron: "35 7 * * 1-5"
      timezone: "Europe/Madrid"
    - cron: "35 10 * * 1-5"
      timezone: "Europe/Madrid"

concurrency:
  group: stock-signal-lab-daily-alerts
  cancel-in-progress: false

jobs:
  recover-arena:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Recuperar solo Arena, sin recalcular señales ni reenviar Stock Signal Lab
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EMAIL_SMTP_HOST: smtp.gmail.com
          EMAIL_SMTP_PORT: "465"
          EMAIL_SMTP_USE_SSL: "true"
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SENDER_NAME: Stock Signal Lab
        run: python -m scripts.send_arena_digest
