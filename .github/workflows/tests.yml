name: Pruebas y estabilidad

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: stock-signal-lab-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar sintaxis
        run: python -m py_compile app.py src/*.py scripts/*.py

      - name: Ejecutar pruebas
        run: python -m pytest -q

  migration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node para la base temporal
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar PostgreSQL WASM sólo para las pruebas
        run: npm install --prefix "$GITHUB_WORKSPACE" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8

      - name: Validar migraciones, permisos y rollback sin producción
        run: node scripts/validate_migrations.mjs "$GITHUB_WORKSPACE"

      - name: Validar registro inmutable del modelo, moneda y permisos
        run: node scripts/validate_model_results_migration.mjs "$GITHUB_WORKSPACE"

      - name: Validar informes diarios privados y reserva de correo
        run: node scripts/validate_daily_digest_migration.mjs "$GITHUB_WORKSPACE"

      - name: Validar caché de mercado privada y protección de escrituras
        run: node scripts/validate_market_cache_migration.mjs "$GITHUB_WORKSPACE"

      - name: Validar guardado principal independiente y conservación del historial
        run: node scripts/validate_primary_snapshot_migration.mjs "$GITHUB_WORKSPACE"

      - name: Validar reanudación privada y protección de escrituras de Radar
        run: node scripts/validate_radar_review_migration.mjs "$GITHUB_WORKSPACE"
